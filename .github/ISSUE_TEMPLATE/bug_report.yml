name: Bug report
description: Something in Katofli does not work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Katofli version
      description: Settings > System > About.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display setup
      description: For example, Windows 11 24H2, two displays, one at 150 % scale.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Read any log before you paste it. Logs can contain device names, file names and web addresses. Remove what you do not want to share.
